[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exiledbroker"
version = "0.0.1"
description = "Path of Exile league-start market speculation"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "polars>=1.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
pg = ["psycopg[binary]>=3.2", "psycopg-pool>=3.2"]  # Postgres (the hosted database)

[project.scripts]
eb = "exiledbroker.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/exiledbroker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
