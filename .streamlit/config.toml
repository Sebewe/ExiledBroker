# ExiledBroker theme: dark, finance-style, with a Path of Exile gold accent.
# Based on the developing-with-streamlit "financial-dashboard" template.

[theme]
base = "dark"
primaryColor = "#D4A657"
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
codeBackgroundColor = "#1E293B"
textColor = "#F1F5F9"
linkColor = "#D4A657"
borderColor = "#334155"
codeTextColor = "#CBD5E1"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "6px"
buttonRadius = "6px"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["28px", "22px", "18px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
linkUnderline = false
greenColor = "#34D399"
redColor = "#F87171"
yellowColor = "#FBBF24"
orangeColor = "#FB923C"
blueColor = "#60A5FA"
violetColor = "#A78BFA"
grayColor = "#94A3B8"
chartCategoricalColors = [
    "#D4A657",
    "#60A5FA",
    "#34D399",
    "#A78BFA",
    "#F87171",
    "#38BDF8",
    "#FB923C",
    "#94A3B8",
]
dataframeBorderColor = "#334155"
dataframeHeaderBackgroundColor = "#1E293B"
dataframeHeaderTextColor = "#F8FAFC"

[theme.sidebar]
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
codeBackgroundColor = "#1E293B"
textColor = "#F1F5F9"
borderColor = "#334155"
primaryColor = "#D4A657"
