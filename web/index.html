<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // The saved theme before the first paint (lib/theme.ts keeps it in sync).
      try {
        if (localStorage.getItem('eb-theme') === 'light') document.documentElement.dataset.theme = 'light'
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="Path of Exile currency exchange: live arbitrage loops, divination card turn-ins and launch-week prices."
    />
    <meta name="theme-color" content="#1d2028" />
    <!-- The link preview (Discord, X, YouTube, Reddit): crawlers don't run scripts, so
         it's here, one for the whole site. The image is drawn by scripts/og_image.py. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ExiledBroker" />
    <meta property="og:title" content="ExiledBroker: Path of Exile currency exchange, hour by hour" />
    <!-- While the pre-launch preview is on (docs/announcement.md). After the launch, put
         back the durable line: "Sell now or hold, from past league starts. The loops and
         card turn-ins that paid this hour. What to buy on day 1, backtested." -->
    <meta
      property="og:description"
      content="Preview: Allflame's first week, rewound. Pick a day, make your call on what to buy, sell or hold, then see what happened next. Goes live with the next league on Nov 13."
    />
    <meta property="og:url" content="https://exiledbroker.trade/" />
    <meta property="og:image" content="https://exiledbroker.trade/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ExiledBroker: Path of Exile currency exchange, hour by hour" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>ExiledBroker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
