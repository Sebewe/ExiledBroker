<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // The saved theme before the first paint (lib/theme.ts keeps it in sync).
      try {
        if (localStorage.getItem('eb-theme') === 'light') document.documentElement.dataset.theme = 'light'
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="Path of Exile currency exchange: live arbitrage loops, divination card turn-ins and launch-week prices."
    />
    <title>ExiledBroker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
