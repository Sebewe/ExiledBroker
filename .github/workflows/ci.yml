# Lint and test on every push and pull request.
# The repo is public, so GitHub's standard runners are free; only the standard
# ubuntu-latest runner is used, and stale runs are cancelled.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: |
          ruff format --check .
          ruff check .
      - name: Test
        run: pytest -q

  # The services against Postgres (the hosted database): the schema builds, every
  # service gives DuckDB's answers, and the live pages' queries can use an index.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: eb
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      EB_TEST_POSTGRES_URL: postgresql://postgres:eb@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e '.[dev,pg]'
      - name: Test on Postgres
        run: pytest -q tests/test_postgres.py tests/test_pipeline.py tests/test_backup.py

  # The frontend: types (generated from the API), lint, component tests, production build.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The Cloudflare fallback Worker (deploy/cloudflare/): node:test with a stubbed fetch.
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test "deploy/cloudflare/*.test.mjs"

  # The image Railway runs builds (not pushed anywhere).
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t exiledbroker:ci .
      - name: Smoke test (API answers, frontend served)
        run: |
          docker run -d --name eb -p 8000:8000 exiledbroker:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
          curl -sf localhost:8000/ | grep -q '<div id="root">'
