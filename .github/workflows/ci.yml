# Lint and test on every push and pull request.
# The repo is public, so GitHub's standard runners are free; only the standard
# ubuntu-latest runner is used, and stale runs are cancelled.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e '.[dev,demo]'
      - name: Lint
        run: |
          ruff format --check .
          ruff check .
      - name: Test
        run: pytest -q

  # The services against Postgres (the hosted database): the schema builds, every
  # service gives DuckDB's answers, and the live pages' queries can use an index.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: eb
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      EB_TEST_POSTGRES_URL: postgresql://postgres:eb@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e '.[dev,demo,pg]'
      - name: Test on Postgres
        run: pytest -q tests/test_postgres.py
