# --- Vendor upgrades: `ratio` of a tier for one of the next -------------------------
[tiers.essence]
# "<Tier> Essence of <Kind>": 3 of a tier for 1 of the next (Shrieking to Deafening too).
ratio = 3
pattern = "{tier} Essence of {kind}"
tiers = ["Whispering", "Muttering", "Weeping", "Wailing", "Screaming", "Shrieking", "Deafening"]

[tiers.oil]
# "<Tier> Oil": Clear (lowest) to Golden (highest).
ratio = 3
pattern = "{tier} Oil"
tiers = [
    "Clear", "Sepia", "Amber", "Verdant", "Teal", "Azure", "Indigo",
    "Violet", "Crimson", "Black", "Opalescent", "Silver", "Golden",
]

# --- Rerolls: valued at the floor ---------------------------------------------------
[reroll.scarab]
# The vendor: 3 identical scarabs for 1 of a different type.
count = 3
like = ["%Scarab%"]

# Harvest's "change" crafts turn a stack into a different item of its kind, for
# lifeforce. GGG publishes no costs per item, so these report the gain per item before
# lifeforce and how many units of that lifeforce the gain would pay for (compare that
# with the craft's cost in game).
[reroll.harvest_delirium_orb]
count = 1
like = ["% Delirium Orb"]
lifeforce = "Primal Crystallised Lifeforce"

[reroll.harvest_breach_splinter]
count = 1
like = ["Splinter of %"]
lifeforce = "Wild Crystallised Lifeforce"

[reroll.harvest_breachstone]
count = 1
# Plain breachstones only: "Xoph's Charged Breachstone" doesn't match.
like = ["%'s Breachstone"]
lifeforce = "Wild Crystallised Lifeforce"

[reroll.harvest_conqueror_crest]
count = 1
like = ["%'s Crest"]
lifeforce = "Vivid Crystallised Lifeforce"
