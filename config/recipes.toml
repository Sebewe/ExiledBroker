# Item recipes the research prices against the exchange (analysis/recipes.py).
#
# Three kinds:
#   [[combine]]  a fixed number of one item becomes a fixed number of another: shards and
#                splinters stack into an orb or a fragment. Priced every hour both trade.
#   [tiers.*]    a vendor turns `ratio` of one tier into one of the next, for every item
#                name that exists at both tiers (essences, oils).
#   [reroll.*]   `count` of one item becomes one random other item of its pool (the scarab
#                vendor recipe, Harvest's "change" crafts). Valued at the floor, the
#                cheapest item the pool can roll, as for random card rewards (finding 12):
#                a pool that's too broad can only lower the floor. Priced daily.
#
# Names are item.canonical_name. A recipe whose items don't trade in a league is skipped
# and listed, so a misspelt name shows up instead of silently pricing nothing.
# Ratios checked 2026-10-26: shards 20 (RePoE: "A stack of 20 shards becomes a Mirror
# of Kalandra"), the scarab vendor's 3 identical for 1 different (vhpg, 3.24), oils
# 3 for the next tier at a vendor (wiki). Check after a patch.

