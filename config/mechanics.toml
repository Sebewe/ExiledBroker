# Mechanic baskets (docs/farming.md, workstream A): the core pool's farming lists, item
# labels in Price check's search and the hour-of-day profiles (docs/price-check.md).
#
# Each mechanic lists what farming it drops, by exact item name as ExiledBroker
# stores it (the in-game name; a name RePoE gives to several items carries its
# metadata name, e.g. "Fine Delirium Orb (CurrencyAfflictionOrbCurrency)").
# Check the file against the local database with `eb mechanics check`.
#
# Left out on purpose (the user, 2026-10-24): Harbinger is no longer in the game, and
# Fracturing Orbs are core drops nobody can target-farm. Breach's currency comes from
# glands that aren't listed on trade, with highly variable rewards. Sanctum mostly
# yields raw currency (its Volatile Vaal Orb is a rare extra), so there's no basket to
# price.
#
#   outputs  what the mechanic drops: the basket whose prices are tracked and shown.
#            Only items in the core drop pool are shown (config/core_pool.toml);
#            `eb mechanics check` lists the outputs the pool doesn't have yet.
#   groups   whole price-mapping groups as outputs (e.g. the followed divination cards).
#   legacy   outputs removed from the game: used only for past leagues' curves, never shown.
#   inputs   what running the mechanic costs (scarabs, astrolabes): context, not the basket.
#   note     shown with the mechanic (optional).
#
# Uniques are left out on purpose: they aren't target-farmed by mechanic.
# "Traded in" below is from the exchange history (Settlers, Mercenaries, Keepers,
# Mirage, Allflame).

