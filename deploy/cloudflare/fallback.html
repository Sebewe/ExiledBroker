<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<!-- Try again by itself every 90 seconds; the Worker serves this only while the origin is down. -->
<meta http-equiv="refresh" content="90">
<title>ExiledBroker is having a problem</title>
<style>
  /* The site's Dusk theme (web/src/index.css). Self-contained: no fonts, scripts or
     images are fetched, so this page works when everything else is down. */
  :root {
    --bg: #1d2028;
    --surface: #252933;
    --border: #3a404e;
    --text: #e8eaf0;
    --muted: #a9afbd;
    --accent: #e3ac72;
    --accent-strong: #f0c393;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: "Nunito Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.55;
  }
  main {
    width: 100%;
    max-width: 30rem;
    padding: 32px 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 1rem;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
  }
  .brand {
    margin: 0 0 20px;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
  }
  h1 {
    margin: 0 0 12px;
    font-family: "Fraunces", ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-size: 1.75rem;
    font-weight: 600;
    line-height: 1.2;
  }
  p { margin: 0 0 12px; color: var(--muted); }
  .again {
    display: inline-block;
    margin-top: 8px;
    padding: 9px 18px;
    border: 1px solid var(--accent);
    border-radius: 0.75rem;
    color: var(--accent-strong);
    font-weight: 700;
    text-decoration: none;
  }
  .again:hover { background: var(--accent); color: var(--bg); }
  .again:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <p class="brand">ExiledBroker</p>
  <h1>Something went wrong, we're investigating</h1>
  <p>The site can't be reached right now. It may be updating or restarting, and it usually comes back within a few minutes.</p>
  <p>This page checks again by itself every minute and a half.</p>
  <a class="again" href="">Try again now</a>
</main>
</body>
</html>
